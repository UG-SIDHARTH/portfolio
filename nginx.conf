# SidharthOS - Nginx Reverse Proxy Configuration Template
# Copy this file to `/etc/nginx/sites-available/portfolio` and symlink it to `sites-enabled`

# Redirect www to root apex domain
server {
    listen 80;
    listen [::]:80;
    server_name www.ugsidharth.in;
    return 301 https://ugsidharth.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ugsidharth.in;

    # Log file locations
    access_log /var/log/nginx/portfolio_access.log;
    error_log /var/log/nginx/portfolio_error.log;

    # 1. Deny access to dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # 2. Deny access to sensitive server config & data extensions (.json, .md, .yml, .log, .conf)
    location ~* \.(json|md|yml|yaml|log|conf|sh|env)$ {
        deny all;
        return 403;
    }

    # 3. Block direct web access to sensitive filenames specifically
    location ~ ^/(messages\.json|data/|package.*\.json|Dockerfile|docker-compose\.yml) {
        deny all;
        return 403;
    }

    # 4. Reverse proxy requests to Node Express server (port 8601)
    location / {
        proxy_pass http://127.0.0.1:8601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Security headers forwarded to Express
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
